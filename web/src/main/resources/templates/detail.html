<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <meta charset="UTF-8">
    <title>도서 상세</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<div layout:fragment="content" class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0" th:text="${book.title}">도서 제목</h2>
        <!-- 브라우저 히스토리 : 이전에 있었던 페이지로 이동-->
        <a href="javascript:history.back()"
           class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> 뒤로 가기
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-header fs-3 fw-bold">
            <i class="bi bi-book me-2"></i>도서 정보
        </div>

        <div class="row g-0">
            <div class="col-md-3 text-center p-4">
                <img th:src="${book.imageUrl}"
                     alt="도서 이미지"
                     class="img-fluid rounded shadow-sm"
                     style="max-height:350px;">
            </div>

            <div class="col-md-9">
                <div class="card-body p-4 fs-4">

                    <div class="row mb-3">
                        <div class="col-sm-2 fw-bold">
                            <i class="bi bi-person me-2"></i>저자
                        </div>
                        <div class="col-sm-10" th:text="${book.author}"></div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-sm-2 fw-bold">
                            <i class="bi bi-building me-2"></i>출판사
                        </div>
                        <div class="col-sm-10" th:text="${book.publisherName}"></div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-sm-2 fw-bold">
                            <i class="bi bi-calendar-event me-2"></i>출판일
                        </div>
                        <div class="col-sm-10" th:text="${book.publishedDate}"></div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-sm-2 fw-bold">
                            <i class="bi bi-upc me-2"></i>ISBN
                        </div>
                        <div class="col-sm-10" th:text="${book.isbn}"></div>
                    </div>

                    <div class="row align-items-center">
                        <div class="col-sm-2 fw-bold">
                            <i class="bi bi-cash me-2"></i>가격
                        </div>
                        <div class="col-sm-10">
                            <span th:if="${book.price != null and book.price > 0}"
                                  class="badge bg-warning fs-5 px-3 py-2"
                                  th:text="${#numbers.formatInteger(book.price, 3, 'COMMA')} + '원'">
                            </span>

                            <span th:unless="${book.price != null and book.price > 0}"
                                  class="text-muted fs-5">
                                가격 미정
                            </span>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div class="mt-5 card shadow-lg border-0">
        <div class="card-header fs-3 fw-bold">
            <i class="bi bi-journal-text me-2"></i>도서 소개
        </div>

        <div class="card-body p-4">

            <div class="mb-4" th:if="${book.subTitle != null and !book.subTitle.isEmpty()}">
                <h4 class="fw-bold text-primary mb-3">부제</h4>
                <p class="fs-4 mb-0" th:text="${book.subTitle}"></p>
            </div>

            <div>
                <h4 class="fw-bold text-primary mb-3">요약</h4>
                <p class="fs-4 lh-lg mb-0" th:text="${book.content}"></p>
            </div>

        </div>
    </div>

    <div th:replace="~{review :: review}"></div>
</div>
</body>
</html>
